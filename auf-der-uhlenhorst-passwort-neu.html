<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neues Passwort – Auf der Uhlenhorst</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1d2b5b;
    }

    .wrap {
      max-width: 480px;
      margin: 80px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1d2b5b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .msg {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
    }

    .msg.success {
      display: block;
      background: #e8f5e9;
      color: #256029;
    }

    .msg.error {
      display: block;
      background: #fdecea;
      color: #a32020;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Neues Passwort</h1>

    <p>
      Bitte gib dein neues Passwort zweimal ein.
      Es muss mindestens 8 Zeichen lang sein.
    </p>

    <form id="resetForm">

      <label for="password">Neues Passwort</label>
      <input
        type="password"
        id="password"
        required
        minlength="8"
        autocomplete="new-password"
      >

      <label for="passwordRepeat">Passwort wiederholen</label>
      <input
        type="password"
        id="passwordRepeat"
        required
        minlength="8"
        autocomplete="new-password"
      >

      <button type="submit">Neues Passwort speichern</button>

    </form>

    <div id="msg" class="msg"></div>

  </div>
</div>

<script>
const API_BASE = '/api';

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

document.getElementById('resetForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  const password = document.getElementById('password').value;
  const passwordRepeat = document.getElementById('passwordRepeat').value;

  if (!token) {
    showMsg('Der Passwort-Link ist ungültig.', 'error');
    return;
  }

  if (password.length < 8) {
    showMsg('Das Passwort muss mindestens 8 Zeichen lang sein.', 'error');
    return;
  }

  if (password !== passwordRepeat) {
    showMsg('Die beiden Passwörter stimmen nicht überein.', 'error');
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/auth/reset-password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        token: token,
        password: password
      })
    });

    const data = await res.json();

    if (!res.ok) {
      showMsg(data.error || 'Das Passwort konnte nicht geändert werden.', 'error');
      return;
    }

    showMsg(
      'Passwort erfolgreich geändert. Du kannst dich jetzt mit deinem neuen Passwort anmelden.',
      'success'
    );

    document.getElementById('resetForm').style.display = 'none';

    setTimeout(() => {
      window.location.href = 'auf-der-uhlenhorst-login.html';
    }, 3000);

  } catch (err) {
    showMsg('Verbindung zum Server fehlgeschlagen. Bitte erneut versuchen.', 'error');
  }
});
</script>

</body>
</html>
