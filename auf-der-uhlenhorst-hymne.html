<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hymne – Auf der Uhlenhorst</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --deep: #0b1b2e;
      --gold: #c9a45c;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--deep);
      color: var(--white);
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .nav-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo img {
      height: 58px;
      display: block;
    }

    .hymn-label {
      color: var(--gold);
      font-size: 1.05rem;
      font-weight: 600;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 70px 28px 90px;
      text-align: center;
    }

    .music-note {
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
    }

    h1 span {
      color: var(--gold);
    }

    .intro {
      max-width: 680px;
      margin: 20px auto 45px;
      line-height: 1.7;
      color: rgba(255,255,255,0.85);
    }

    .player-card {
      max-width: 700px;
      margin: 0 auto;
      padding: 38px 30px;
      border-radius: 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(201,164,92,0.45);
    }

    .player-card h2 {
      margin-top: 0;
      color: var(--gold);
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 45px;
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .nav-wrap {
        padding: 14px 18px;
      }

      .logo img {
        height: 48px;
      }

      main {
        padding: 45px 18px 70px;
      }

      .player-card {
        padding: 28px 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav-wrap">
    <a href="auf-der-uhlenhorst-home.html" class="logo">
      <img src="logo-schwan-weiss.png" alt="Auf der Uhlenhorst">
    </a>

    <div class="hymn-label">♫ Hymne</div>
  </div>
</header>

<main>

  <div class="music-note">♫</div>

  <h1>UNSERE <span>UHLENHORST</span> HYMNE</h1>

  <p class="intro">
    Ein Lied für unseren Stadtteil, für die Menschen, die hier leben,
    arbeiten und sich auf der Uhlenhorst zu Hause fühlen.
  </p>

  <div class="player-card">
    <h2>Auf der Uhlenhorst</h2>
    <p>Unsere Hymne zum Anhören.</p>

    <audio controls>
      <source src="auf-der-uhlenhorst-hymne.mp3" type="audio/mpeg">
      Dein Browser unterstützt die Audiowiedergabe leider nicht.
    </audio>
  </div>

  <a class="back-link" href="auf-der-uhlenhorst-home.html">
    ← Zurück zur Startseite
  </a>

</main>

</body>
</html>
